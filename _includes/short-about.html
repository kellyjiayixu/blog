<section>
    <hr>
    <h5><a href="{{'/' | prepend: site.baseurl }}">ABOUT ME</a></h5>
    <div class="short-about">
        {% if site.sidebar-avatar %}
        <img src="{{ site.sidebar-avatar }}" alt="{{ site.title }}">
        {% endif %}

        <p>{{ site.sidebar-about-description }}</p>
        {% endif %}
    </div>
</section>
